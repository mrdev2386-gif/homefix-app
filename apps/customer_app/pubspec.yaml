name: customer_app
description: Customer App for HomeFix.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  dio: ^5.3.0

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.0.0
  cloud_functions: ^5.0.0
  firebase_app_check: ^0.3.2+10
  firebase_crashlytics: ^4.3.0
  firebase_performance: ^0.10.0
  firebase_storage: ^12.0.0

  # Device Features
  image_picker: ^1.0.7
  flutter_local_notifications: ^17.1.2

  # Payments
  razorpay_flutter: ^1.3.6

  # Storage & Utils
  shared_preferences: ^2.2.0
  provider: ^6.1.1
  intl: ^0.19.0
  url_launcher: ^6.2.2
  share_plus: ^7.2.2
  app_links: ^6.3.2
  package_info_plus: ^8.0.0

  # Google
  google_fonts: ^5.1.0
  google_sign_in: ^6.2.1
  google_generative_ai: ^0.2.1

  # Location
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  permission_handler: ^11.0.1

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  google_maps_flutter: ^2.12.3
  carousel_slider: ^5.1.2
  smooth_page_indicator: ^1.1.0
  video_player: ^2.8.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/banners/
    - assets/icons/
    - assets/images/
    - assets/categories/
    - assets/services/
    - lib/l10n/
