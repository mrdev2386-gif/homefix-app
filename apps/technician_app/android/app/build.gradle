plugins {
    id "com.android.application"
    id "kotlin-android"
    // Flutter Gradle plugin (must be after Android & Kotlin)
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase (Auth, Firestore, etc.)
    id "com.google.gms.google-services"
}

android {
    namespace = "com.homefix.technician"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    // Disable asset compression for debug builds to prevent memory issues
    aaptOptions {
        noCompress = ['flutter_assets', '*.png', '*.jpg', '*.jpeg', '*.gif', '*.webp', '*.svg', '*.ttf', '*.otf', '*.json']
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    defaultConfig {
        applicationId = "com.homefix.technician"

        // 🔴 IMPORTANT: Firebase Auth requires minSdk 23
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file('key.properties')
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            } else {
                // Fallback for CI/CD or dev without keys
                storeFile = file("debug.keystore") // Placeholder
                storePassword = "android"
                keyAlias = "androiddebugkey"
                keyPassword = "android"
            }
        }
    }

    buildTypes {
        debug {
            // Disable compression for debug to prevent memory issues
            aaptOptions {
                noCompress = ['flutter_assets', '*.png', '*.jpg', '*.jpeg', '*.gif', '*.webp', '*.svg', '*.ttf', '*.otf', '*.json']
            }
        }
        release {
            signingConfig signingConfigs.release
            // Add ProGuard/R8
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.google.firebase:firebase-appcheck-debug'
}
